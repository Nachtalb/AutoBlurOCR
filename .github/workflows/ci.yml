name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned so a rebuilt runner cannot silently change the ffmpeg that produced an exhibit.
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.7z

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # caches ~/.cargo and src-tauri/target, keyed on Cargo.lock and the toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The frontend's own self-test: box model, ffmpeg expression emitter, matching, tracking,
      # keyframe stepping and chunking. No bundler, no dependencies — it runs the app's own code.
      - name: frontend self-test
        run: node tools/jstest.mjs

      - name: cache ffmpeg sidecars
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ hashFiles('.github/workflows/ci.yml') }}

      # ffmpeg and ffprobe are bundled sidecars, never resolved from PATH.
      - name: fetch ffmpeg sidecars
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.7z -UseBasicParsing
          7z x ffmpeg.7z -offmpeg -y | Out-Null
          $bin = (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$bin\ffmpeg.exe"  src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item "$bin\ffprobe.exe" src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe

      - name: record the bundled ffmpeg
        shell: pwsh
        run: src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version | Select-Object -First 1

      # Windows OCR needs a recognizer language pack. Hosted images may not ship one; if this
      # cannot install it the OCR tests report themselves as skipped rather than failing, and
      # the step below makes it visible either way.
      - name: install the English OCR language pack
        continue-on-error: true
        shell: pwsh
        run: |
          $c = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0' -ErrorAction SilentlyContinue
          if ($c -and $c.State -ne 'Installed') { Add-WindowsCapability -Online -Name $c.Name | Out-Null }
          Get-WindowsCapability -Online -Name 'Language.OCR*' |
            Select-Object Name, State | Format-Table -AutoSize

      # --no-default-features drives the core without pulling in the webview stack.
      - name: core + OCR acceptance tests
        run: cargo test --no-default-features --manifest-path src-tauri/Cargo.toml -- --include-ignored --nocapture

      - name: build the app
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
