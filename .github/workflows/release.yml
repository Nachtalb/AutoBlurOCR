name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release, e.g. v0.3.0'
        required: true

permissions:
  contents: write

env:
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.7z

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: frontend self-test
        run: node tools/jstest.mjs

      - name: cache ffmpeg sidecars
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ hashFiles('.github/workflows/release.yml') }}

      - name: fetch ffmpeg sidecars
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.7z -UseBasicParsing
          7z x ffmpeg.7z -offmpeg -y | Out-Null
          $bin = (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$bin\ffmpeg.exe"  src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item "$bin\ffprobe.exe" src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe

      - name: install the English OCR language pack
        continue-on-error: true
        shell: pwsh
        run: |
          $c = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0' -ErrorAction SilentlyContinue
          if ($c -and $c.State -ne 'Installed') { Add-WindowsCapability -Online -Name $c.Name | Out-Null }
          Get-WindowsCapability -Online -Name 'Language.OCR*' | Select-Object Name, State | Format-Table -AutoSize

      # A release that leaks text is worse than no release, so the acceptance tests —
      # including the export round trip — gate the installer.
      - name: acceptance tests
        run: cargo test --no-default-features --manifest-path src-tauri/Cargo.toml -- --include-ignored --nocapture

      - name: refuse to release if the tag and the manifests disagree
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $conf  = (Select-String -Path src-tauri/tauri.conf.json -Pattern '"version"\s*:\s*"([^"]+)"').Matches[0].Groups[1].Value
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($conf -ne $cargo) { throw "Cargo.toml says $cargo, tauri.conf.json says $conf" }
          if ($tag -ne "v$conf") {
            throw "tag $tag does not match version $conf — this version is written into every redaction log, so they must agree"
          }
          "releasing v$conf"

      - name: cache tauri-cli
        id: cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: install tauri-cli
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # The NSIS template is vendored and patched (src-tauri/windows/) so an upgrade installs in
      # place instead of offering to uninstall first. A different bundler version may have moved
      # on; fail loudly rather than shipping a stale installer.
      - name: vendored NSIS template still matches its upstream
        shell: pwsh
        run: |
          $pin = (Get-Content src-tauri/windows/UPSTREAM.txt -Raw)
          if ($pin -notmatch 'tauri-bundler ([\d.]+).*sha256 (\w+)') { throw 'cannot parse UPSTREAM.txt' }
          $ver, $sha = $Matches[1], $Matches[2]
          $up = Get-ChildItem "$env:USERPROFILE/.cargo/registry/src" -Recurse -Filter installer.nsi -EA SilentlyContinue |
                Where-Object FullName -like "*tauri-bundler-$ver*" | Select-Object -First 1
          if (-not $up) { throw "tauri-bundler $ver not in the registry - the fork is pinned to it, so the bundler moved. Re-sync src-tauri/windows/installer.nsi." }
          $now = (Get-FileHash $up.FullName -Algorithm SHA256).Hash
          if ($now -ne $sha) { throw "upstream installer.nsi changed ($now != $sha). Re-sync the fork and update UPSTREAM.txt." }
          "vendored template matches tauri-bundler $ver"

      - name: build installer
        run: cargo tauri build
        working-directory: src-tauri

      - name: checksum
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "$h *$($f.Name)" | Out-File "$($f.FullName).sha256" -Encoding ascii -NoNewline
          "$($f.Name)  $h"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          body: |
            Offline OCR-driven text redaction for video. Windows 11, no network.

            The installer bundles ffmpeg and ffprobe; nothing is resolved from `PATH`.
            Installs per-user to `%LOCALAPPDATA%\AutoBlur`, so there is no admin prompt.

            Needs a Windows OCR language pack: *Settings → Time & language → Language →*
            (your language) *→ Language options → Optional features → Optical character
            recognition.*

            Verify the download against the `.sha256` beside it.
